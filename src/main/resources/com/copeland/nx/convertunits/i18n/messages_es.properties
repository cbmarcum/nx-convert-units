help.label=Este programa es para la conversión de archivos NX de pulgadas a milímetros o milímetros a pulgadas .\u000A \
\u000A \
Usage:\u000A \
1. Seleccionar el archivo o directorio a convertir.\u000A \
2. Seleccionar un directorio desocupado o un directorio que no contenga los mismos nombres de los archivos a convertir.\u000A \
3. Seleccionar las unidades a que desea convertir. Los archivos seleccionados con las mismas unidades no serán tomadas en cuenta.\u000A \
4. Seleccionar el botón de acuerdo para comenzar la conversión. De acuerdo al número de archivos esto puede tomar varios minutos.\u000A \
\u000A \
Contacto: Carl Marcum at x7814
