help.label=This program is for the conversion of NX files from inches to millimeters or millimeters to inches.\u000A \
\u000A \
Usage:\u000A \
1. Select a file or directory to convert.\u000A \
2. Select an empty directory or a directory that does not contain filenames the same as those being converted.\u000A \
3. Select the units to convert to. Selected files with the same units will be skipped.\u000A \
4. Select the Okay button to begin conversions. Depending on the number of files this could take several minutes.\u000A \
\u000A \
Contact: Carl Marcum at x7814