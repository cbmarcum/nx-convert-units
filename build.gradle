plugins {
    id 'java'
    id 'application'
    id 'groovy'
    id 'org.javamodularity.moduleplugin' version '1.8.15'
    id 'org.openjfx.javafxplugin' version '0.0.13'
    id 'org.beryx.jlink' version '3.0.1'
}

group = 'com.copeland.nx'
version = '1.0.0'

repositories {
    mavenCentral()
}

def junitVersion = '5.12.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

application {
    mainModule = 'com.copeland.nx.convertunits'
    mainClass = 'com.copeland.nx.convertunits.ConvertUnitsApplication'
}

javafx {
    version = '21.0.6'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    // javafx app defaults
    implementation 'org.apache.groovy:groovy:4.0.21'
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.3.1'
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"

    // convert units service
    implementation 'org.apache.commons:commons-exec:1.6.0'
    implementation 'commons-io:commons-io:2.21.0'

    // logging
    implementation platform('org.apache.logging.log4j:log4j-bom:2.25.3')
    implementation 'org.apache.logging.log4j:log4j-api:${log4j-api.version}'

    // The logging implementation (i.e., Log4j Core)
    implementation 'org.apache.logging.log4j:log4j-core' // TEST was runtimeOnly

    // Log4j JSON-encoding support
    runtimeOnly 'org.apache.logging.log4j:log4j-layout-template-json' // needed ??

    // SLF4J-to-Log4j bridge
    // runtimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl' // if any dependencies use SLF4J


}

tasks.withType(Test) {
    useJUnitPlatform()
}

// override of start script templates

tasks.named('startScripts') {
    // unixStartScriptGenerator.template = resources.text.fromFile('my-custom-unix-script.txt')
    windowsStartScriptGenerator.template = resources.text.fromFile('my-custom-windows-script.txt')
}



jlink {
    imageZip = layout.buildDirectory.file("/distributions/app-${javafx.platform.classifier}.zip")
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'app'
    }
}
